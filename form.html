    <head>
        <meta charset="UTF-8">

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;400&display=swap" rel="stylesheet">

        <!-- CSS -->
        <link rel="stylesheet" href="styles/form.css">
        <link rel="stylesheet" href="styles/form-large.css">

        <!-- JavaScript -->
        <script src="scripts/form.js" defer></script>
    </head>

    <body>
        <header>
            <h1>Product Review</h1>
        </header>

        <main>
            <form method="get" action="review.html">
                <!-- Product Name -->
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Choose a Product ...</option>
                </select>

                <!-- Rating -->
                <!-- <fieldset>
                    <legend>Overall Rating</legend>
                        <div class="stars"></div>   
                            
                            <label><input type="radio" name="rating" value="1" required> ★</label>
                            <label><input type="radio" name="rating" value="2"> ★★</label>
                            <label><input type="radio" name="rating" value="3"> ★★★</label>
                            <label><input type="radio" name="rating" value="4"> ★★★★</label>
                            <label><input type="radio" name="rating" value="5"> ★★★★★</label>
                        </div>
                </fieldset> -->
                
                <fieldset>
                    <legend>Overall Rating</legend>

                    <div class="rating-grid">

                        <div class="rating-item">
                            <label for="rating1">
                                <div class="star-display">★</div>
                            </label>
                            <input type="radio" id="rating1" name="rating" value="1" required>
                        </div>

                        <div class="rating-item">
                            <label for="rating2">
                                <div class="star-display">★★</div>
                            </label>
                            <input type="radio" id="rating2" name="rating" value="2" required>
                        </div>

                        <div class="rating-item">
                            <label for="rating3">
                                <div class="star-display">★★★</div>
                            </label>
                            <input type="radio" id="rating3" name="rating" value="3" required>
                        </div>

                        <div class="rating-item">
                            <label for="rating4">
                                <div class="star-display">★★★★</div>
                            </label>
                            <input type="radio" id="rating4" name="rating" value="4" required>
                        </div>

                        <div class="rating-item">
                            <label for="rating5">
                                <div class="star-display">★★★★★</div>
                            </label>
                            <input type="radio" id="rating5" name="rating" value="5" required>
                        </div>

                    </div>
                </fieldset>
                
                <!-- <fieldset>
                    <legend>Overall Rating</legend>
                    <div class="stars">
                        <input type="radio" id="star5" name="rating" value="5" required>
                        <label for="star5" title="5 stars">★</label>
                        <input type="radio" id="star4" name="rating" value="4" required>
                        <label for="star4" title="4 stars">★</label>
                        <input type="radio" id="star3" name="rating" value="3" required>
                        <label for="star3" title="3 stars">★</label>
                        <input type="radio" id="star2" name="rating" value="2" required>
                        <label for="star2" title="2 stars">★</label>
                        <input type="radio" id="star1" name="rating" value="1" required>
                        <label for="star1" title="1 stars">★</label>
                    </div>
                </fieldset> -->
                

                <!-- Installation Date -->
                <div class="form-group">
                    <label for="installDate">Date of Installation</label>
                    <input type="date" id="installDate" name="installDate" required>
                </div> 
                <!-- Features -->
                <fieldset>
                    <legend>What features did you find useful in the product? (check all that apply)</legend>
                    <label for="feature1"><input type="checkbox" id="feature1" name="features" value="Durability"> Durability</label>
                    <label for="feature2"><input type="checkbox" id="feature2" name="features" value="Ease of Use"> Ease of Use</label>
                    <label for="feature3"><input type="checkbox" id="feature3" name="features" value="Performance"> Performance</label>
                    <label for="feature4"><input type="checkbox" id="feature4" name="features" value="Design"> Design</label>
                </fieldset>

                <!-- Written Review -->
                <label for="review">Writen Review (Optional)</label>
                <textarea id="review" name="review" rows="4" placeholder="Write your review here..." ></textarea>

                <!-- Name -->
                <label for="username">Your Name (Optional)</label>
                <input type="text" id="username" name="username" placeholder="Enter your name">

                <!--Submit button-->
                <input type="submit" value="Post Review">
            </form>

        </main>

        <footer>
            <p>&copy; <span id="currentYear"></span> Richard Udonsa | Nigeria</p>
            <p id="lastModified"></p>
        </footer>
    </body>
</html>
