<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Review - Richard Udonsa</title>
        <meta name="description" content="Product Review Form">
        <meta name="author" content="Richard Udonsa">

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;400&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="styles/form.css">
        <link rel="stylesheet" href="styles/form-large.css">

        <script src="scripts/form.js" defer></script>
    </head>
    
    <body>
        <header>
            <h1>Product Review</h1>
        </header>
        
        <main>
            <form method="get" action="review.html">
                
                <!-- Product Name -->
                <label for="product">Product Name <span class="required"></span></label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>

                <!-- Rating -->
                <fieldset aria-required="true">
                    <legend>Overall Rating <span class="required"></span></legend>

                    <div class="rating-grid">
                        <div class="rating-item">
                            <label for="rating1">★</label>
                            <input type="radio" id="rating1" name="rating" value="1" required>
                        </div>

                        <div class="rating-item">
                            <label for="rating2">★★</label>
                            <input type="radio" id="rating2" name="rating" value="2" required>
                        </div>

                        <div class="rating-item">
                            <label for="rating3">★★★</label>
                            <input type="radio" id="rating3" name="rating" value="3" required>
                        </div>

                        <div class="rating-item">
                            <label for="rating4">★★★★</label>
                            <input type="radio" id="rating4" name="rating" value="4" required>
                        </div>

                        <div class="rating-item">
                            <label for="rating5">★★★★★</label>
                            <input type="radio" id="rating5" name="rating" value="5" required>
                        </div>
                    </div>
                </fieldset>

                <!-- Installation Date -->
                <label for="installDate">Date of Installation <span class="required"></span></label>
                <input type="date" id="installDate" name="installDate" required>

                <!-- Features -->
                <fieldset>
                    <legend>Useful Features (check all that apply)</legend>

                    <label for="durability">
                        <input type="checkbox" id="durability" name="features" value="Durability">
                        Durability
                    </label>

                    <label for="ease">
                        <input type="checkbox" id="ease" name="features" value="Ease of Use">
                        Ease of Use
                    </label>

                    <label for="performance">
                        <input type="checkbox" id="performance" name="features" value="Performance">
                        Performance
                    </label>

                    <label for="design">
                        <input type="checkbox" id="design" name="features" value="Design">
                        Design
                    </label>
                </fieldset>

                <!-- Written Review -->
                <label for="review">Written Review (Optional)</label>
                <textarea id="review" name="review" rows="4"></textarea>

                <!-- User Name -->
                <label for="username">Your Name (Optional)</label>
                <input type="text" id="username" name="username">

                <input type="submit" value="Submit Review">

            </form>
        </main>

        <footer>
            <p>&copy; <span id="currentYear"></span> Richard Udonsa</p>
            <p id="lastModified"></p>
        </footer>
    </body>
</html>
