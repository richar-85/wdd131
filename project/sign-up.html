<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up | Weekend Soccer Pickup Game</title>
        <meta name="description" content="Sign up to join 
        the Weekend Soccer Pickup Game.">
        <meta name="author" content="Richard Udonsa" />

        <!--Google Font-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;400&display=swap" rel="stylesheet">

        <!--CSS Link-->
        <link rel="stylesheet" href="style/siteplan.css">
    </head>

    <body>
        <header>
            <h1>Weekend Soccer Pickup Game</h1>

            <nav>
                <ul class="nav">
                    <li><a href="siteplan.html">Home</a></li>
                    <li><a href="details.html">Game-Details</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="sign-up.html">Sign-Up</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="signup">
                <h2>Sign Up to Play</h2>
                <p>
                    Fill out the form below to let us know you are coming.
                    All skill levels are welcome!
                </p>

                <form method="get" action="confirmation.html">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required>

                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>

                    <label for="experience">Soccer Experience Level</label>
                    <select id="experience" name="experience" required>
                        <option value="">Select an option</option>
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>

                    <label for="availability">Can you attend this weekend?</label>
                    <select id="availability" name="availability" required>
                        <option value="">Select an option</option>
                        <option value="yes">Yes</option>
                        <option value="maybe">Maybe</option>
                        <option value="no">No</option>
                    </select>

                    <button type="submit">Submit</button>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; <span id="currentYear"></span> Richard Udonsa | Nigeria</p>
            <p id="lastModified"></p>
        </footer>
    </body>
</html>
