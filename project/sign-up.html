<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up | Weekend Soccer Pickup Game</title>
        <meta name="description" content="Sign up to join 
        the Weekend Soccer Pickup Game.">
        <meta name="author" content="Richard Udonsa" />

        <!--Google Font-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;400&display=swap" rel="stylesheet">

        <!--CSS Link-->
        <link rel="stylesheet" href="styles/siteplan.css">
        <link rel="stylesheet" href="styles/siteplan-large.css">

        <!--JavaScript-->
        <script src="scripts/siteplan.js" defer></script>

    </head>

    <body>
        <header>
            <div class="logo-title">
                <img src="images/soccer_logo.PNG" alt="Soccer ball logo" width="50" height="50" loading="lazy">
                <h1>Weekend Soccer Pickup Game</h1>
            </div>

            <button id="menuBtn" aria-label="Open Navigation" aria-expanded="false">☰</button>

            <nav aria-label="Main Navigation">
                <ul class="nav" id="primaryNav">
                    <li><a href="siteplan.html" class="nav-link">Home</a></li>
                    <li><a href="details.html" class="nav-link">Game-Details</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                    <li><a href="sign-up.html" class="nav-link active">Sign-Up</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="signup">
                <h2>Sign Up to Play</h2>
                <p>
                    Fill out the form below to let us know you are coming.
                    All skill levels are welcome!
                </p>

                <form method="get" action="confirmation.html" class="signup-form">
                    <fieldset>
                        <legend>Player Information</legend>

                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname"
                            placeholder="Enter your full name..." 
                        required>

                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email"
                            placeholder="Enter your email..." 
                        required>

                        <label for="experience">Soccer Experience Level</label>
                        <select id="experience" name="experience" required>
                            <option value="">Select an option</option>
                            <option value="beginner">Beginner</option>
                            <option value="intermediate">Intermediate</option>
                            <option value="advanced">Advanced</option>
                        </select>

                        <legend>Can you attend this weekend?</legend>

                        <label>
                            <input type="radio" name="availability" value="yes" required>
                            Yes
                        </label>

                        <label>
                            <input type="radio" name="availability" value="maybe" required>
                            Maybe
                        </label>

                        <label>
                            <input type="radio" name="availability" value="no" required>
                            No
                        </label>

                        <button type="submit" class="btn">Submit</button>
                    </fieldset>

                </form>
            </section>
        </main>

        <footer>
            <p>&copy; <span id="currentYear"></span> Richard Udonsa | Nigeria</p>
            <p id="lastModified"></p>
        </footer>
    </body>
</html>
